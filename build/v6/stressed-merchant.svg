  <path d="M205 262 C 215 190, 260 172, 300 175 C 345 172, 392 195, 396 262 C 370 228, 350 214, 330 222 C 318 204, 292 200, 280 222 C 258 212, 228 228, 205 262 Z" fill="#231C24"/>
  <path d="M250 180 C 230 140, 200 150, 185 125 M330 176 C 350 130, 390 140, 405 112 M300 172 C 300 130, 280 118, 290 95" stroke="#231C24" stroke-width="9" fill="none" stroke-linecap="round"/>
