  <g fill="#E7B48F">
    <ellipse cx="200" cy="268" rx="36" ry="46"/>
    <ellipse cx="400" cy="268" rx="36" ry="46"/>
    <path d="M178 235 q-6 -34 14 -40 M196 228 q-2 -40 18 -40 M214 232 q6 -34 22 -30" stroke="#E7B48F" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M422 235 q6 -34 -14 -40 M404 228 q2 -40 -18 -40 M386 232 q-6 -34 -22 -30" stroke="#E7B48F" stroke-width="15" stroke-linecap="round" fill="none"/>
  </g>
  <!-- worried brows -->
  <path d="M245 262 L 285 272" stroke="#231C24" stroke-width="8" stroke-linecap="round"/>
  <path d="M355 262 L 315 272" stroke="#231C24" stroke-width="8" stroke-linecap="round"/>
  <!-- squeezed eyes -->
  <path d="M250 300 L 280 292 L 250 284" stroke="#231C24" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M350 300 L 320 292 L 350 284" stroke="#231C24" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- blush -->
  <ellipse cx="248" cy="330" rx="18" ry="10" fill="#E88F8F" opacity="0.55"/>
  <ellipse cx="352" cy="330" rx="18" ry="10" fill="#E88F8F" opacity="0.55"/>
  <!-- grimace mouth -->
  <path d="M268 360 C 285 342, 315 342, 332 360 C 315 380, 285 380, 268 360 Z" fill="#7A2E35"/>
  <path d="M276 356 L 324 356" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <!-- sweat drops -->
  <path d="M440 210 C 452 228, 456 240, 446 248 C 436 254, 426 244, 432 232 Z" fill="#6FB3E8"/>
  <path d="M158 190 C 168 205, 170 216, 162 222 C 154 226, 146 218, 150 208 Z" fill="#6FB3E8"/>
  <!-- stress marks -->
  <path d="M470 150 l 30 -20 M480 185 l 38 -4 M125 150 l -30 -20 M115 185 l -38 -4" stroke="#D64545" stroke-width="7" stroke-linecap="round"/>
</svg>
